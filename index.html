<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Near Hermès</title>
<style>
  :root { --bg:#050b24; --bg2:#102564; --card:rgba(214,224,245,.08); --txt:#f2f5ff; --muted:#aab6d6; --primary:#2d6cf0; --ok:#3ccf91; --err:#ff6b5e; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body { font-family:"Mona Sans","Segoe UI",system-ui,sans-serif; color:var(--txt);
    background:radial-gradient(120% 70% at 80% 110%,rgba(45,108,240,.28),transparent 65%),linear-gradient(180deg,#050b24 0%,#0b1748 60%,#102564 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; font-size:16px; line-height:1.55; }
  main { width:100%; max-width:420px; background:var(--card); backdrop-filter:blur(18px); border-radius:24px; padding:32px 24px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),0 10px 40px rgba(2,6,24,.25); text-align:center; }
  h1 { margin:0 0 4px; font-size:28px; letter-spacing:-.01em; }
  .sous { margin:0 0 28px; color:var(--muted); }
  button { font:inherit; cursor:pointer; border:0; border-radius:999px; min-height:56px; width:100%; padding:0 24px; font-weight:600; font-size:18px; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline:3px solid #9ec1ff; outline-offset:3px; }
  #go { background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; gap:10px; }
  #go:disabled { opacity:.7; cursor:wait; }
  .lien { background:transparent; color:var(--muted); min-height:44px; font-size:15px; font-weight:500; margin-top:12px; }
  .etat { margin-top:22px; min-height:52px; }
  .etat p { margin:6px 0 0; }
  .decompte:empty { display:none; }
  .heures { font-size:18px; font-weight:600; margin:0 0 18px; }
  .decompte { font-size:44px; font-weight:700; letter-spacing:-1px; margin:4px 0 0; font-variant-numeric:tabular-nums; min-height:52px; }
  .etape { opacity:.75; font-size:15px; }
  .barre { height:6px; border-radius:6px; background:rgba(255,255,255,.12); overflow:hidden; margin-top:10px; }
  .barre i { display:block; height:100%; width:0; background:var(--primary); transition:width .6s ease; }
  .err { color:var(--err); }
  .ok { color:var(--ok); }
  .gros { width:100%; border:0; display:flex; align-items:center; justify-content:center; min-height:64px; border-radius:999px; background:var(--ok); color:#04130c; font-weight:700; font-size:20px; text-decoration:none; margin-top:16px; }
  #jeton { display:none; text-align:left; margin-top:20px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input { width:100%; min-height:48px; border-radius:12px; border:1px solid rgba(255,255,255,.2); background:rgba(5,11,36,.6); color:var(--txt); padding:0 14px; font:inherit; }
  .aide { color:var(--muted); font-size:14px; margin:8px 0 14px; }
  .aide a { color:#9ec1ff; }
  #save { background:#f2f5ff; color:#050b24; }
  svg { width:22px; height:22px; }
  @media (prefers-reduced-motion: reduce) { .barre i { transition:none; } }
</style>
</head>
<body>
<main>
  <h1>Near Hermès</h1>
  <p class="sous">Un clic : j'allume Hermès, puis j'ouvre le dashboard.</p>
  <p id="heures" class="heures">Temps restant ce mois : je regarde…</p>

  <button id="go" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2v10"/><path d="M5.6 6.6a8 8 0 1 0 12.8 0"/></svg>
    <span>Allumer et ouvrir</span>
  </button>

  <div class="etat" role="status" aria-live="polite">
    <p id="msg">Prêt.</p>
    <p id="dec" class="decompte" aria-hidden="true"></p>
    <p id="etape" class="etape"></p>
    <div class="barre" aria-hidden="true"><i id="prog"></i></div>
  </div>

  <div id="pret" hidden>
    <button id="ouvrir" class="gros" type="button">Ouvrir Hermès</button>
  </div>

  <form id="jeton">
    <label for="cle">Jeton GitHub (une seule fois)</label>
    <input id="cle" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
    <p class="aide">Il reste seulement dans ce navigateur. Droits : Codespaces lecture + Codespaces lifecycle admin.
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Créer le jeton</a></p>
    <button id="save" type="submit">Enregistrer</button>
  </form>

  <button id="oubli" class="lien" type="button">Changer le jeton</button>
</main>
<script>
(function () {
  var DEPOT = "ElyNear/hermes-codespace";
  var PORTE = "https://hermes-codespace.taile5fa20.ts.net";
  var GH = "https://api.github.com";
  var API = ""; // trouvé au lancement : le codespace du dépôt (marche même s'il est recréé)
  var HEURES_GRATUITES = 60; // 120 heures-cœur par mois = 60 h sur 2 cœurs
  var CLE = "nearHermesJeton";

  var go = document.getElementById("go"), msg = document.getElementById("msg"), prog = document.getElementById("prog");
  var form = document.getElementById("jeton"), cle = document.getElementById("cle");

  function dire(t, cls) { msg.textContent = t; msg.className = cls || ""; }
  var pct = 0;
  function decompte(n) { var d = document.getElementById("dec"); d.textContent = n > 0 ? n + " %" : ""; }
  // Pourcentage réel : chaque étape vérifiée fait monter la barre. Entre deux étapes, elle avance doucement sans dépasser la suivante.
  function viser(min, max) { pct = Math.max(pct, min); pct = Math.min(max - 1, pct + Math.max(0.3, (max - pct) * 0.06)); montrer(); }
  function montrer() { var p = Math.floor(pct); barre(p); decompte(p); }
  function etape(t) { document.getElementById("etape").textContent = t; }
  function barre(p) { prog.style.width = Math.max(0, Math.min(100, p)) + "%"; }
  function jeton() { try { return localStorage.getItem(CLE) || ""; } catch (e) { return ""; } }
  function attendre(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function gh(chemin, methode) {
    return fetch(GH + chemin, { method: methode || "GET",
      headers: { "Authorization": "Bearer " + jeton(), "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" } });
  }
  async function trouver() {
    if (API) return;
    var r = await gh("/user/codespaces?per_page=50");
    if (r.status === 401 || r.status === 403) throw new Error("jeton");
    var l = (await r.json()).codespaces || [];
    for (var i = 0; i < l.length; i++) if (l[i].repository && l[i].repository.full_name === DEPOT) { API = GH + "/user/codespaces/" + l[i].name; return; }
    throw new Error("introuvable");
  }
  async function pretHermes() {
    try { var r = await fetch(PORTE + "/pret", { cache: "no-store" }); return r.ok && (await r.json()).hermes === true; }
    catch (e) { return false; }
  }
  // Heures gratuites restantes ce mois (API facturation GitHub, droit « Plan : lecture » sur le jeton).
  async function heures() {
    var el = document.getElementById("heures");
    if (!jeton()) { el.textContent = ""; return; }
    try {
      var u = await (await gh("/user")).json();
      var r = await gh("/users/" + encodeURIComponent(u.login) + "/settings/billing/usage/summary?product=codespaces");
      if (r.status === 401 || r.status === 403 || r.status === 404) { el.textContent = "Temps restant : il manque un droit au jeton."; return; }
      var d = await r.json(), coeurH = 0;
      (d.usageItems || []).forEach(function (it) {
        var sku = String(it.sku || ""), unite = String(it.unitType || "");
        if (/storage|stockage/i.test(sku) || (!/compute/i.test(sku) && !/^hours?$/i.test(unite))) return;
        var m = sku.match(/(\d+)\s*[-_ ]?\s*core/i);
        coeurH += (Number(it.grossQuantity) || 0) * (m ? Number(m[1]) : 2);
      });
      var reste = Math.max(0, HEURES_GRATUITES - coeurH / 2);
      var h = Math.floor(reste), mn = Math.round((reste - h) * 60);
      el.textContent = "Il te reste " + h + " h " + (mn < 10 ? "0" : "") + mn + " sur " + HEURES_GRATUITES + " h ce mois-ci.";
    } catch (e) { el.textContent = "Temps restant : pas disponible pour l'instant."; }
  }

  function api(methode, chemin) {
    return fetch(API + (chemin || ""), {
      method: methode,
      headers: { "Authorization": "Bearer " + jeton(), "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }
    }).then(function (r) {
      if (r.status === 401 || r.status === 403) throw new Error("jeton");
      if (r.status === 404) throw new Error("introuvable");
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    });
  }

  function pret() {
    go.style.display = "none"; document.getElementById("pret").hidden = false;
    document.getElementById("ouvrir").focus();
    setTimeout(entrer, 1500);
  }

  // Entrée par la porte Near (Tailscale Funnel) : le jeton part en POST, jamais dans l'adresse.
  function entrer() {
    var f = document.createElement("form");
    f.method = "POST"; f.action = PORTE + "/porte"; f.style.display = "none";
    var i = document.createElement("input"); i.type = "hidden"; i.name = "t"; i.value = jeton();
    f.appendChild(i); document.body.appendChild(f); f.submit();
  }

  async function lancer() {
    if (!jeton()) { form.style.display = "block"; cle.focus(); dire("Il faut d'abord ton jeton GitHub."); return; }
    go.disabled = true; pct = 0; viser(2, 10);
    try {
      await trouver();
      var cs = await api("GET");
      if (cs.state === "Available" && await pretHermes()) { pct = 100; montrer(); dire("Déjà allumé.", "ok"); pret(); return; }
      dire("Allumage :");
      if (cs.state !== "Available" && cs.state !== "Starting" && cs.state !== "Queued" && cs.state !== "Provisioning") await api("POST", "/start");
      var debut = Date.now(), n = 0;
      // Étape 1 : le codespace s'allume (0 à 50 %).
      etape("Étape 1 sur 2 : j'allume le codespace");
      while (cs.state !== "Available") {
        await attendre(1000); n++;
        var bas = { Queued: 5, Provisioning: 10, Starting: 15 }[cs.state] || 3;
        viser(bas, 50);
        if (n % 3 === 0) cs = await api("GET");
        if (Date.now() - debut > 240000) throw new Error("trop long");
      }
      pct = Math.max(pct, 50); montrer();
      // Étape 2 : Hermès démarre (50 à 100 %). Vérifié pour de vrai : la porte répond et le dashboard aussi.
      etape("Étape 2 sur 2 : Hermès démarre");
      while (!(await pretHermes())) {
        viser(55, 100);
        await attendre(1500);
        if (Date.now() - debut > 300000) throw new Error("trop long");
      }
      pct = 100; montrer(); etape(""); dire("C'est prêt.", "ok"); heures(); pret();
    } catch (e) {
      go.disabled = false; pct = 0; barre(0); decompte(0); etape("");
      if (e.message === "jeton") { dire("Le jeton est refusé. Mets-en un nouveau.", "err"); form.style.display = "block"; }
      else if (e.message === "introuvable") dire("Codespace introuvable. Il a peut-être été supprimé.", "err");
      else if (e.message === "trop long") dire("Ça prend trop de temps. Réessaie dans une minute.", "err");
      else dire("Erreur réseau. Vérifie ta connexion et réessaie.", "err");
    }
  }

  // QR personnel : le jeton arrive dans le fragment (#j=...), jamais envoyé au serveur. On le garde puis on l'efface de l'adresse.
  (function () {
    var m = location.hash.match(/[#&]j=([A-Za-z0-9_]+)/);
    if (m) { try { localStorage.setItem(CLE, m[1]); } catch (e) {} history.replaceState(null, "", location.pathname); }
  })();
  if (jeton()) form.style.display = "none";
  heures();
  go.addEventListener("click", lancer);
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var v = cle.value.trim();
    if (!v) { dire("Colle le jeton dans le champ.", "err"); return; }
    try { localStorage.setItem(CLE, v); } catch (e) {}
    cle.value = ""; form.style.display = "none"; dire("Jeton enregistré.", "ok"); heures(); lancer();
  });
  document.getElementById("ouvrir").addEventListener("click", entrer);
  document.getElementById("oubli").addEventListener("click", function () {
    try { localStorage.removeItem(CLE); } catch (e) {}
    form.style.display = "block"; cle.focus(); dire("Colle le nouveau jeton.");
  });
  if (!jeton()) { form.style.display = "block"; dire("Première fois : colle ton jeton GitHub."); }
})();
</script>
</body>
</html>
